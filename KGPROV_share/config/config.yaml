# =====================================================================
#  KGPROV run configuration
#  Model IDs verified against Bedrock list-inference-profiles and a
#  live converse() round-trip in us-east-1 (both returned OK).
# =====================================================================

aws:
  region: "us-east-1"

models:
  # Weak arm: Phases 1, 3 and 4, and Phase 2 Tier 1 and Tier 2 when it is
  # named in --tier1-arms / --tier2-arms. Its max_tokens is used for
  # every model call, strong-arm calls included.
  weak_arm:
    # Not read by the code.
    name: "Claude Haiku 4.5"
    model_id: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
    # Not read by the code.
    temperature: 0.0
    max_tokens: 2048

  # Strong arm: Phase 2 Tier 1 and Tier 2 when it is named in
  # --tier1-arms / --tier2-arms. The runner's default --tier1-arms
  # includes it, and --tier2-arms defaults to every Tier 1 arm.
  strong_arm:
    # Not read by the code.
    name: "Claude Sonnet 4.5"
    model_id: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    # Not read by the code.
    temperature: 0.0
    # Not read by the code.
    max_tokens: 2048

# Retrieval stack. MeSH-scale, so exact indices; FAISS is convenience
# not necessity at this cardinality.
retrieval:
  # Not read by the code.
  encoder: "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
  dense_top_k: 200
  sparse_top_k: 200
  rrf_k: 60          # named because it changes fusion materially
  fused_top_k: 100
  rerank_top_k: 5
  score_floor: 0.15  # tau; ablated below

# decoding.temperature is passed to every model call, the Tier 2 agent
# included. This is greedy decoding, not reproducibility -- persistence
# provides that.
decoding:
  temperature: 0.0
  # Not read by the code.
  top_p: 1.0

# Chunking
chunking:
  max_chunk_tokens: 512
  sentence_overlap: 1

# Ontology drift: two real MeSH releases.
ontology:
  primary: "data/mesh/desc2025.xml"
  version_primary: "2025"
  prior: "data/mesh/desc2023.xml"
  version_prior: "2023"

corpus:
  bc5cdr_dir: "data/bc5cdr"
  # The reported baseline uses the full 500-document development split.
  # Not read by the code.
  n_docs: 500

# Ablation matrix. Each variant is one full run; content-addressed IDs
# make cross-run comparison a graph query (CQ4).
# Not read by the code.
ablations:
  score_floor:      [0.05, 0.15, 0.30]
  ontology_coverage: [1.0, 0.7, 0.4]
  rerank_top_k:     [5, 20]
  model_tier:       ["weak_arm", "strong_arm"]   # Tier 1 contrast

paths:
  response_log: "out/response_log"   # every request/response, for replay
  # Not read by the code.
  provenance:   "out/provenance"     # per-run TTL
  # Not read by the code.
  results:      "out/results"

run:
  # Not read by the code.
  concurrency: 8
  max_retries: 5
  # Dedup keys per document. Used for one thing only: turning
  # --sample-strong N into an admission rate (N / (n_docs * this)).
  # Measured at 2,291 keys over the 500-document dev split. An inaccurate
  # estimate costs sample size, never correctness -- the realised count is
  # written to the manifest and is the number that gets reported.
  keys_per_doc_estimate: 4.6
